services:
  - type: web
    name: geo-research-copilot-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NCBI_EMAIL
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./geo_copilot.db
